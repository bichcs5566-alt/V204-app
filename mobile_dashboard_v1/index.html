<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>每日操作介面</title>
  <link rel="stylesheet" href="./style.css" />

  <!-- v324.2 CORE force visual patch：關掉右側 pill，展開卡片補右下小欄位 -->
  <style>
    .v322-core-badge,.v322-core-ribbon,.v323-core-pill,.v323-core-slot{
      display:none!important;visibility:hidden!important;width:0!important;max-width:0!important;
      overflow:hidden!important;padding:0!important;margin:0!important;
    }
    .v3242-core-card{
      border-color:#a855f7!important;
      box-shadow:0 0 0 2px rgba(168,85,247,.16)!important;
      background:linear-gradient(180deg,rgba(250,245,255,.90),rgba(255,255,255,.98))!important;
    }
    .v3242-core-collapsed{
      border-color:#a855f7!important;
      background:linear-gradient(90deg,rgba(250,245,255,.98),rgba(255,255,255,.96))!important;
    }
    .v3242-core-collapsed::after{
      content:"🟣 CORE";display:inline-flex;align-items:center;justify-content:center;
      margin-left:auto;margin-right:10px;padding:.22rem .54rem;border-radius:999px;
      border:1px solid rgba(168,85,247,.34);background:rgba(168,85,247,.12);
      color:#7e22ce;font-size:clamp(12px,2.8vw,15px);font-weight:950;line-height:1.1;
      white-space:nowrap;box-sizing:border-box;
    }
    .v3242-core-field{
      min-height:64px;border-radius:18px;border:1px solid rgba(168,85,247,.34);
      background:rgba(250,245,255,.90);box-shadow:inset 0 0 0 1px rgba(255,255,255,.72);
      padding:.46rem .58rem;display:flex;flex-direction:column;justify-content:center;gap:.12rem;
      box-sizing:border-box;
    }
    .v3242-core-field-label{color:#7e22ce;font-size:clamp(12px,2.9vw,15px);font-weight:850;line-height:1.12;opacity:.86}
    .v3242-core-field-value{color:#6d28d9;font-size:clamp(17px,4.3vw,23px);font-weight:950;line-height:1.15}
    .v3242-core-text{color:#7e22ce!important;font-weight:950!important}
  </style>
</head>
<body>
  <script src="./app.js"></script>

  <!-- v324.2 CORE force visual patch：JS 必須在 app.js 後面 -->
  <script>
  (function(){
    "use strict";
    function ready(fn){document.readyState==="loading"?document.addEventListener("DOMContentLoaded",fn,{once:true}):fn();}
    ready(function(){
      var files=["./data/strategy_evolution.csv","./data/ignition_candidates.csv","data/strategy_evolution.csv","data/ignition_candidates.csv","./strategy_evolution.csv","./ignition_candidates.csv"];
      var core=new Map(), loaded=false;

      function parseCSV(t){
        var rows=[],row=[],cell="",q=false;
        for(var i=0;i<t.length;i++){
          var ch=t[i],nx=t[i+1];
          if(q){if(ch=='"'&&nx=='"'){cell+='"';i++;}else if(ch=='"')q=false;else cell+=ch;}
          else{if(ch=='"')q=true;else if(ch==","){row.push(cell);cell="";}else if(ch=="\n"){row.push(cell);rows.push(row);row=[];cell="";}else if(ch!="\r")cell+=ch;}
        }
        if(cell.length||row.length){row.push(cell);rows.push(row);}
        if(!rows.length)return[];
        var h=rows.shift().map(function(s){return String(s||"").trim();});
        return rows.filter(function(r){return r.some(function(x){return String(x||"").trim()!=="";});}).map(function(r){
          var o={};h.forEach(function(k,i){o[k]=r[i]==null?"":String(r[i]).trim();});return o;
        });
      }
      function sidOf(r){var m=String(r.stock_id||r.sid||r.code||r.symbol||"").match(/\d{4}/);return m?m[0]:"";}
      function isCore(r){
        var s=[r.lifecycle_stage,r.strategy_bucket,r.strategy_layer,r.strategy_type,r.bucket,r.source,r.system_note,r.reason,r.is_core_v319,r.core_marker].map(function(x){return String(x||"");}).join(" ");
        return /CORE|核心主升|🟣/.test(s)||String(r.is_core_v319||"").trim()==="1";
      }
      function txt(el){return(el&&el.textContent?el.textContent:"").replace(/\s+/g," ").trim();}
      function expanded(el){var t=txt(el);return /股票名稱/.test(t)&&/策略層/.test(t)&&/進場型態/.test(t)&&/\d{4}/.test(t);}
      function collapsed(el){var t=txt(el);return !expanded(el)&&/(試單|觀察|買進|WATCH|TEST)/.test(t)&&/\d{4}/.test(t)&&/高流動性|中流動性|低流動性/.test(t);}
      function nearest(el){
        var cur=el,b=null;
        for(var i=0;cur&&i<12;i++,cur=cur.parentElement){if(expanded(cur))return cur;if(!b&&collapsed(cur))b=cur;}
        return b;
      }
      function killOld(root){
        Array.prototype.slice.call((root||document).querySelectorAll(".v322-core-badge,.v322-core-ribbon,.v323-core-pill,.v323-core-slot")).forEach(function(e){e.remove();});
      }
      function addField(card){
        if(card.querySelector(".v3242-core-field"))return;
        var field=document.createElement("div");
        field.className="v3242-core-field";
        field.innerHTML='<div class="v3242-core-field-label">CORE 標記</div><div class="v3242-core-field-value">🟣 核心主升</div>';
        var all=Array.prototype.slice.call(card.querySelectorAll("*"));
        var a=all.find(function(e){return /^籌碼集中度/.test(txt(e));})||all.find(function(e){return /^K線結構/.test(txt(e));})||all.find(function(e){return /^MA20觀察/.test(txt(e));})||all.find(function(e){return /^流動性分數/.test(txt(e));});
        if(a&&a.parentElement)a.parentElement.insertAdjacentElement("afterend",field);else card.appendChild(field);
      }
      function mark(card,row){
        if(!card)return; killOld(card);
        if(expanded(card)){
          card.classList.add("v3242-core-card"); addField(card);
          Array.prototype.slice.call(card.querySelectorAll("*")).forEach(function(e){
            var x=txt(e);
            if(x==="EVOLUTION"||x==="IGNITION"||x==="TEST"||x==="WATCH"){e.textContent="🟣 CORE｜核心主升";e.classList.add("v3242-core-text");}
            if(/策略進場/.test(x)&&row&&/核心主升|CORE|🟣/.test(Object.values(row).join(" "))){e.textContent="核心主升";e.classList.add("v3242-core-text");}
          });
        }else{card.classList.add("v3242-core-collapsed");}
      }
      function apply(){
        if(!loaded||!core.size||!document.body)return;
        killOld(document);
        var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),nodes=[];
        while(w.nextNode())nodes.push(w.currentNode);
        core.forEach(function(row,sid){
          nodes.filter(function(n){return String(n.nodeValue||"").trim()===sid;}).forEach(function(n){var c=nearest(n.parentElement);if(c)mark(c,row);});
        });
      }
      Promise.all(files.map(function(u){
        return fetch(u+"?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():"";}).then(function(t){if(!t)return;parseCSV(t).forEach(function(r){var s=sidOf(r);if(s&&isCore(r))core.set(s,r);});}).catch(function(){});
      })).then(function(){loaded=true;apply();});
      new MutationObserver(function(){requestAnimationFrame(apply);}).observe(document.documentElement,{childList:true,subtree:true});
      window.addEventListener("focus",apply);document.addEventListener("visibilitychange",apply);setInterval(apply,1200);
    });
  })();
  </script>

</body>
</html>
