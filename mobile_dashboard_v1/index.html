<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>每日操作介面</title>
  <link rel="stylesheet" href="./style.css" />

  <!-- v323 CORE compact visual patch
       只補 CORE 視覺，不改 app.js / 不改後端 / 不新增清單。
       修正 v322 太大問題：
       1) 不再插入大型紫色說明卡
       2) 只把核心股原本黃色卡片改成淡紫框/淡紫底
       3) 在卡片右下/空白處放小型 CORE 提示
  -->
  <style>
    .v323-core-card {
      border-color: #a855f7 !important;
      box-shadow: 0 0 0 2px rgba(168, 85, 247, .14) !important;
      background: linear-gradient(180deg, rgba(250,245,255,.86), rgba(255,255,255,.98)) !important;
    }

    .v323-core-pill {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      gap: .28em;
      padding: .24rem .58rem;
      border-radius: 999px;
      border: 1px solid rgba(168, 85, 247, .35);
      background: rgba(168, 85, 247, .12);
      color: #7e22ce;
      font-size: clamp(12px, 2.8vw, 15px);
      font-weight: 950;
      line-height: 1.15;
      white-space: nowrap;
      box-sizing: border-box;
    }

    .v323-core-slot {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      min-height: 1.8rem;
      margin-top: .35rem;
    }

    .v323-core-text {
      color: #7e22ce !important;
      font-weight: 950 !important;
    }

    .v323-core-card .v322-core-ribbon,
    .v323-core-card .v322-core-badge {
      display: none !important;
    }
  </style>
</head>
<body>
  <script src="./app.js"></script>

  <script>
  (function () {
    "use strict";

    const DATA_FILES = [
      "./data/strategy_evolution.csv",
      "./data/ignition_candidates.csv",
      "data/strategy_evolution.csv",
      "data/ignition_candidates.csv",
      "./strategy_evolution.csv",
      "./ignition_candidates.csv"
    ];

    const coreMap = new Map();
    let loaded = false;

    function parseCSV(text) {
      const rows = [];
      let row = [], cell = "", q = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i], nx = text[i + 1];
        if (q) {
          if (ch === '"' && nx === '"') { cell += '"'; i++; }
          else if (ch === '"') q = false;
          else cell += ch;
        } else {
          if (ch === '"') q = true;
          else if (ch === ",") { row.push(cell); cell = ""; }
          else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
          else if (ch !== "\r") cell += ch;
        }
      }
      if (cell.length || row.length) { row.push(cell); rows.push(row); }
      if (!rows.length) return [];
      const header = rows.shift().map(s => String(s || "").trim());
      return rows
        .filter(r => r.some(x => String(x || "").trim() !== ""))
        .map(r => {
          const o = {};
          header.forEach((h, i) => o[h] = r[i] == null ? "" : String(r[i]).trim());
          return o;
        });
    }

    function sidOf(row) {
      const raw = row.stock_id || row.sid || row.code || row.symbol || "";
      const m = String(raw).match(/\d{4}/);
      return m ? m[0] : "";
    }

    function isCore(row) {
      const joined = [
        row.lifecycle_stage,
        row.strategy_bucket,
        row.strategy_layer,
        row.strategy_type,
        row.bucket,
        row.source,
        row.system_note,
        row.reason,
        row.is_core_v319,
        row.core_marker
      ].map(x => String(x || "")).join(" ");
      return /CORE|核心主升|🟣/.test(joined) || String(row.is_core_v319 || "").trim() === "1";
    }

    async function loadCoreMap() {
      for (const url of [...new Set(DATA_FILES)]) {
        try {
          const res = await fetch(url + "?v=" + Date.now(), { cache: "no-store" });
          if (!res.ok) continue;
          const text = await res.text();
          parseCSV(text).forEach(r => {
            const sid = sidOf(r);
            if (sid && isCore(r)) coreMap.set(sid, r);
          });
        } catch (e) {}
      }
      loaded = true;
      applyCoreMarks();
    }

    function textOf(el) {
      return (el && el.textContent ? el.textContent : "").replace(/\s+/g, " ").trim();
    }

    function looksLikeCard(el) {
      if (!el || el === document.body || el === document.documentElement) return false;
      const t = textOf(el);
      if (!t) return false;

      // 展開卡片
      if (/股票名稱|策略層|進場型態|參考價|流動性|籌碼集中度/.test(t) && /\d{4}/.test(t)) return true;

      // 收合列卡片：通常只有「試單/觀察 + 股號 + 價格 + 高流動性」
      if (/(試單|觀察|買進|WATCH|TEST)/.test(t) && /\d{4}/.test(t) && /高流動性|中流動性|低流動性/.test(t)) return true;

      return false;
    }

    function nearestCard(el) {
      let cur = el;
      for (let i = 0; cur && i < 9; i++, cur = cur.parentElement) {
        if (looksLikeCard(cur)) return cur;
      }
      return null;
    }

    function isCollapsedCard(card) {
      const t = textOf(card);
      return !/股票名稱|策略層|進場型態|籌碼集中度/.test(t);
    }

    function putCompactPill(card, sid) {
      if (card.querySelector(".v323-core-pill")) return;

      const pill = document.createElement("span");
      pill.className = "v323-core-pill";
      pill.textContent = "🟣 CORE";

      if (isCollapsedCard(card)) {
        // 收合列：放在最右側，取代原本 v322 大標籤。
        card.appendChild(pill);
        return;
      }

      // 展開卡片：優先放在你截圖圈起來的右下空白區附近。
      const all = Array.from(card.querySelectorAll("*"));
      const anchor =
        all.find(el => /籌碼集中度/.test(textOf(el))) ||
        all.find(el => /流動性分數/.test(textOf(el))) ||
        all.find(el => /K線結構/.test(textOf(el))) ||
        all.find(el => /建議金額/.test(textOf(el)));

      const slot = document.createElement("div");
      slot.className = "v323-core-slot";
      slot.appendChild(pill);

      if (anchor && anchor.parentElement) {
        anchor.parentElement.insertAdjacentElement("afterend", slot);
      } else {
        card.appendChild(slot);
      }
    }

    function markCard(card, sid, row) {
      if (!card || card.dataset.v323CoreDone === sid) return;
      card.dataset.v323CoreDone = sid;
      card.classList.add("v323-core-card");

      // 移除舊版 v322 大提示，避免擋畫面。
      card.querySelectorAll(".v322-core-badge,.v322-core-ribbon").forEach(el => el.remove());

      putCompactPill(card, sid);

      // 展開卡片才改策略欄文字；收合列只加小 CORE 標籤與紫框。
      if (!isCollapsedCard(card)) {
        Array.from(card.querySelectorAll("*")).forEach(el => {
          const tx = textOf(el);
          if (tx === "EVOLUTION" || tx === "IGNITION" || tx === "TEST" || tx === "WATCH") {
            el.textContent = "🟣 CORE｜核心主升";
            el.classList.add("v323-core-text");
          }
          if (/策略進場/.test(tx) && row && /核心主升|CORE|🟣/.test(Object.values(row).join(" "))) {
            el.textContent = "核心主升";
            el.classList.add("v323-core-text");
          }
        });
      }
    }

    function applyCoreMarks() {
      if (!loaded || !coreMap.size) return;

      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
      const textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);

      for (const [sid, row] of coreMap.entries()) {
        const hits = textNodes.filter(n => String(n.nodeValue || "").trim() === sid);
        hits.forEach(hit => {
          const card = nearestCard(hit.parentElement);
          if (card) markCard(card, sid, row);
        });
      }
    }

    loadCoreMap();

    const observer = new MutationObserver(() => {
      window.requestAnimationFrame(applyCoreMarks);
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });

    window.addEventListener("focus", applyCoreMarks);
    document.addEventListener("visibilitychange", applyCoreMarks);
    setInterval(applyCoreMarks, 2500);
  })();
  </script>
</body>
</html>
